<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<title>Márgenes · CORAZ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   1. CONFIG VISUAL — variables de branding (cambiar acá para clonar
      la app a otro negocio: paleta, radios, tipografía)
   ============================================================ */
:root{
  --bg:#14120f; --panel:#1d1a15; --panel-2:#262119; --panel-3:#2f291f; --line:#3a3226;
  --brand:#e8891a; --brand-dim:#8a5518; --brand-soft:rgba(232,137,26,.14);
  --text:#f2ede2; --text-dim:#a89e8c; --text-mute:#7d7464;
  --ok:#4a9d5f; --bad:#c14b3a; --warn:#d4a12a; --info:#4a8a9d;
  --ok-soft:rgba(74,157,95,.15); --bad-soft:rgba(193,75,58,.16); --warn-soft:rgba(212,161,42,.15); --info-soft:rgba(74,138,157,.16);
  --radius:12px; --radius-sm:8px;
  --mono:"SF Mono","JetBrains Mono","Consolas",monospace;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--brand)}
button{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.oculto{display:none!important}
.dim{color:var(--text-dim)} .mute{color:var(--text-mute)}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:30;background:rgba(20,18,15,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1280px;margin:0 auto}
.top-row h1{margin:0;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700;white-space:nowrap}
.top-row h1 span{color:var(--text-dim);font-weight:400;letter-spacing:.06em}
.top-acc{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip-btn{background:transparent;border:1px solid var(--line);color:var(--text-dim);border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip-btn:hover{border-color:var(--brand);color:var(--brand)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1280px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:none;color:var(--text-dim);padding:10px 12px 11px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.activo{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- Layout ---------- */
main{max-width:1280px;margin:0 auto;padding:16px 16px 80px}
.barra-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.barra-filtros .sep{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:none;color:var(--text-dim);padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.seg button.activo{background:var(--brand-soft);color:var(--brand)}
.seg button:hover:not(.activo){color:var(--text)}
input,select,textarea{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:var(--radius-sm);padding:7px 9px;font-size:13px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
input[type=date]{color-scheme:dark}
textarea{width:100%;font-family:var(--mono);font-size:12.5px;resize:vertical}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none}
.periodo-txt{font-size:12px;color:var(--text-dim)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
section.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);font-weight:600;display:flex;align-items:center;gap:8px}
section.card h2 .der{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 12px}
.kpi.destacado{border-color:var(--brand-dim);background:linear-gradient(180deg,var(--brand-soft),var(--panel) 70%)}
.kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);padding-right:22px}
.kpi-valor{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.ayuda{position:absolute;top:9px;right:9px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ayuda:hover,.ayuda.abierta{border-color:var(--brand);color:var(--brand)}
.ayuda-inline{position:static;display:inline-flex;vertical-align:middle;margin-left:4px}
#popover{position:fixed;z-index:200;max-width:300px;background:var(--panel-3);border:1px solid var(--brand-dim);border-radius:var(--radius-sm);padding:11px 13px;font-size:12.5px;line-height:1.5;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#popover b{color:var(--brand)}
#popover .pv-sec{margin-top:6px;color:var(--text-dim)}

/* ---------- Avisos ---------- */
.aviso{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:10px;border:1px solid}
.aviso.warn{background:var(--warn-soft);border-color:rgba(212,161,42,.35)}
.aviso.info{background:var(--info-soft);border-color:rgba(74,138,157,.35)}
.aviso.bad{background:var(--bad-soft);border-color:rgba(193,75,58,.4)}
.aviso .ico{font-size:15px;line-height:1.2}

/* ---------- Tablas ---------- */
.tabla-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel-2);color:var(--text-dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
th.num,td.num{text-align:right}
th:hover{color:var(--text)}
th .flecha{color:var(--brand);margin-left:3px}
td{padding:8px 10px;border-bottom:1px solid rgba(58,50,38,.55);white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:default}
tbody tr.click{cursor:pointer}
tbody tr:hover{background:rgba(232,137,26,.05)}
td.titulo{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.mas{display:block;margin:10px auto 0}

/* ---------- Badges / semáforo ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap;font-weight:600}
.b-ok{color:#7cc68e;border-color:rgba(74,157,95,.45);background:var(--ok-soft)}
.b-bajo{color:#e6c25e;border-color:rgba(212,161,42,.45);background:var(--warn-soft)}
.b-neg{color:#e57a69;border-color:rgba(193,75,58,.5);background:var(--bad-soft)}
.b-sin{color:var(--text-dim);border-color:var(--line);background:var(--panel-2)}
.b-est{color:#8fc0cf;border-color:rgba(74,138,157,.45);background:var(--info-soft);font-weight:500}
.b-neutro{color:var(--text-dim);border-color:var(--line);background:transparent;font-weight:500}

/* ---------- Botones ---------- */
.btn{background:var(--brand);color:#1a1208;border:none;border-radius:var(--radius-sm);padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--brand-dim);opacity:.6;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sec:hover{border-color:var(--brand);color:var(--brand)}
.btn.peligro{background:var(--bad);color:#fff}
.btn.chico{padding:5px 10px;font-size:12px}

/* ---------- Estados ---------- */
.estado{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 16px;color:var(--text-dim);text-align:center;font-size:13px}
.spinner{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.estado.error{color:#e57a69}

/* ---------- Cascada (waterfall) ---------- */
.cascada{display:flex;flex-direction:column;gap:5px}
.cas-fila{display:grid;grid-template-columns:140px 1fr 168px;gap:10px;align-items:center;font-size:12.5px}
.cas-fila .lbl{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cas-fila.total .lbl{color:var(--text);font-weight:700}
.cas-pista{position:relative;height:16px;background:rgba(58,50,38,.35);border-radius:4px}
.cas-bar{position:absolute;top:0;bottom:0;border-radius:4px;min-width:2px}
.cas-bar.sub{background:var(--brand)}
.cas-bar.res{background:#6d5a44}
.cas-bar.fin-pos{background:var(--ok)}
.cas-bar.fin-neg{background:var(--bad)}
.cas-fila .val{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cas-fila .pct{color:var(--text-mute);font-size:10.5px;margin-left:5px;display:inline-block;min-width:44px;text-align:right}
@media (max-width:560px){.cas-fila{grid-template-columns:96px 1fr 98px;font-size:11.5px}.cas-fila .pct{display:none}}

/* ---------- Gráfico mensual ---------- */
.chart{width:100%;height:240px;position:relative}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .grid line{stroke:rgba(168,158,140,.13)}
.chart text{fill:var(--text-mute);font-size:10.5px;font-family:var(--sans)}
.chart .bar{fill:var(--brand)}
.chart .bar.negativa{fill:var(--bad)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart .bar.hover{filter:brightness(1.25)}
#tip{position:fixed;z-index:150;pointer-events:none;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;line-height:1.55;box-shadow:0 8px 24px rgba(0,0,0,.45);min-width:170px}
#tip .t-tit{font-weight:700;margin-bottom:3px}
#tip .t-row{display:flex;justify-content:space-between;gap:14px}
#tip .t-row span:last-child{font-family:var(--mono)}

/* ---------- Modal ---------- */
.modal-fondo{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:720px;padding:18px 18px 20px;position:relative}
.modal h3{margin:0 0 4px;font-size:16px}
.modal .cerrar{position:absolute;top:12px;right:12px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin:14px 0;font-size:12.5px}
.meta-grid div span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-mute)}
.func h4{color:var(--brand);margin:16px 0 4px;font-size:13px}
.func p,.func li{font-size:13px;color:var(--text);line-height:1.6}
.func ul{padding-left:18px;margin:4px 0}

/* ---------- Formularios ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.campo label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:4px}
.campo input,.campo select{width:100%}
.campo .hint{font-size:11.5px;color:var(--text-mute);margin-top:3px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.progreso{margin-top:10px;font-size:12.5px;color:var(--text-dim)}
.progreso .barra{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:6px}
.progreso .barra div{height:100%;background:var(--brand);transition:width .25s}
.calc-res{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--brand)}

/* ---------- Gate / login ---------- */
#gate{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate .caja{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px}
#gate h1{margin:0 0 4px;text-align:center;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
#gate .sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin-bottom:20px}
#gate input{width:100%;font-size:16px;padding:11px 10px;margin-bottom:10px}
#gate .btn{width:100%;padding:12px}
#gate .err{color:#e57a69;font-size:12.5px;min-height:18px;margin-top:8px;text-align:center}
#cdnFail{position:fixed;inset:0;z-index:400;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#cdnFail.show{display:flex}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:250;background:var(--panel-3);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
#toast.show{opacity:1}
#toast.ok{border-color:rgba(74,157,95,.6)} #toast.err{border-color:rgba(193,75,58,.6)}

@media (max-width:560px){
  main{padding:12px 12px 70px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi-valor{font-size:18px}
  .top-row h1 span{display:none}
}
</style>
</head>
<body>

<div id="cdnFail"><div><h2 style="color:var(--brand)">No se pudo cargar la librería de Supabase</h2><p class="dim">Revisá tu conexión y recargá la página.</p><button class="btn" onclick="location.reload()">Recargar</button></div></div>

<!-- ================= LOGIN ================= -->
<div id="gate">
  <div class="caja">
    <h1 id="gateTitulo">Márgenes</h1>
    <div class="sub">Margen real por operación de Mercado Libre</div>
    <input id="gateEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="gatePass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="gateBtn">Ingresar</button>
    <div class="err" id="gateError"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="oculto">
  <header class="top">
    <div class="top-row">
      <h1 id="appTitulo">Márgenes <span>· por operación</span></h1>
      <div class="top-acc">
        <button class="chip-btn" id="btnFunc">📖 Funcionamiento de la app</button>
        <button class="chip-btn" id="btnLogout" title="Cerrar sesión">Salir</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main>
    <!-- Filtro global de período (aplica a Resumen, Operaciones, Agrupado y Alertas) -->
    <div class="barra-filtros" id="barraPeriodo">
      <div class="seg" id="segPeriodo"></div>
      <span id="rangoCustom" class="oculto" style="display:inline-flex;gap:6px;align-items:center">
        <input type="date" id="fDesde"> <span class="dim">→</span> <input type="date" id="fHasta">
        <button class="btn chico" id="btnAplicarRango">Aplicar</button>
      </span>
      <span class="sep"></span>
      <label class="chk" title="Excluye las operaciones cuyo costo viene del maestro o es demasiado viejo"><input type="checkbox" id="chkConfiables"> Solo costos confiables</label>
      <span class="periodo-txt" id="periodoTxt"></span>
      <button class="chip-btn" id="btnRecargar" title="Volver a pedir los datos">↻</button>
    </div>

    <div id="vista"></div>
  </main>
</div>

<div id="popover" class="oculto"></div>
<div id="tip" class="oculto"></div>
<div id="toast"></div>
<div id="modalRaiz"></div>

<script>
/* ============================================================
   2. CONFIG (todo lo específico del negocio vive acá → clonable)
   ============================================================ */
const CONFIG = {
  BRAND: { nombre: 'CORAZ', app: 'Márgenes' },
  SUPABASE_URL: 'https://kvewsxrfogosjwehookj.supabase.co',
  // anon key = clave PÚBLICA (publishable). Los datos están protegidos por RLS deny-all
  // y por la Edge Function, que exige login + usuario activo en app_usuarios.
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2ZXdzeHJmb2dvc2p3ZWhvb2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTA2OTksImV4cCI6MjEwMTM2NjY5OX0.6oyDPFG_8hAAULXCUn6uO7C-abxMSOxxMFFJ_xBFZHY',
  FN: 'margenes-data',
  ML_ORDEN_URL: (id) => `https://www.mercadolibre.com.ar/ventas/${encodeURIComponent(id)}/detalle`,
  ML_ITEM_URL: (id) => `https://articulo.mercadolibre.com.ar/${String(id || '').replace(/^MLA/, 'MLA-')}`,
  PERIODO_DEFAULT: '90d',
  TIMEOUT_MS: 30000,
  REINTENTOS: 2,
  FILAS_POR_PAGINA: 150,
  TANDA_COSTOS: 50,          // filas por llamada al guardar costos masivos
  DIAS_STOCK_LENTO: 120,     // cobertura (días) a partir de la cual el stock se considera lento
  APP_VERSION: '2026-10-04.1',
  FN_BILLING_SYNC: 'ml-billing-sync',   // sync de facturación ML (también corre sola 1 vez por día)
  BILLING_SYNC_SEG_ESTIMADOS: 45,       // estimado inicial de la sync de facturación (2 períodos)
  BILLING_SYNC_TIMEOUT_MS: 150000,
  DESTINOS_TANDA: 60,                   // órdenes Flex por llamada al sincronizar destinos
  DESTINOS_MAX_TANDAS: 20,              // tope de seguridad del bucle de sync
  LOGISTICA_NOMBRE: 'Brown',            // nombre visible del proveedor logístico Flex (clonable)
};
const STORAGE_KEY = 'margenes_prefs_v1';

/* ============================================================
   3. ESTADO
   ============================================================ */
if (typeof window.supabase === 'undefined') {
  document.getElementById('cdnFail').classList.add('show');
  throw new Error('supabase-js no cargó desde el CDN');
}
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

const S = {
  auth: null, email: null, puedeEditar: false,
  tab: 'resumen',
  periodo: CONFIG.PERIODO_DEFAULT, desde: null, hasta: null,
  soloConfiables: false,
  config: {},
  ops: null, facturas: [], periodosMl: [], costosSinVenta: [], opsCargando: false, opsError: null, opsRango: null,
  // Ajustes → sub-secciones (logística y facturación se cargan bajo demanda)
  ajSub: 'parametros',
  logistica: null, logCargando: false, logError: null,
  logVista: { qMapeo: '', liqDesde: '', liqHasta: '', sync: null, verHist: false },
  facturacion: null, facCargando: false, facError: null, facKey: null, facSync: null,
  costos: null, costosCargando: false, costosError: null,
  stock: null, stockCargando: false, stockError: null,
  // estado por vista
  opFiltro: { q: '', envio: 'todos', sem: 'todos', limite: CONFIG.FILAS_POR_PAGINA, orden: { col: 'sale_date', dir: -1 } },
  agrup: { por: 'sku', orden: { col: 'margen', dir: -1 }, q: '' },
  alertas: { incluirEstimados: false },
  costosVista: { q: '', soloDif: false, orden: { col: 'sku', dir: 1 } },
  stockVista: { soloLento: false, orden: { col: 'valor', dir: -1 } },
  carga: { modo: 'lista', vigencia: null, proveedor: '', texto: '', preview: null, corriendo: false },
};

function guardarPrefs() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ tab: S.tab, periodo: S.periodo, desde: S.desde, hasta: S.hasta, soloConfiables: S.soloConfiables, agrupPor: S.agrup.por, ajSub: S.ajSub })); } catch (_) {}
}
function leerPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (p.tab) S.tab = p.tab;
    if (p.periodo) S.periodo = p.periodo;
    if (p.desde) S.desde = p.desde;
    if (p.hasta) S.hasta = p.hasta;
    S.soloConfiables = !!p.soloConfiables;

const fmtARS = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const fmtDec = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function n(v) { const x = Number(v); return isFinite(x) ? x : 0; }
function plata(v, conSigno = false) {
  if (v === null || v === undefined || v === '' || !isFinite(Number(v))) return '—';
  const x = Math.round(Number(v));
  return (conSigno && x > 0 ? '+' : '') + (x < 0 ? '−$' : '$') + fmtARS.format(Math.abs(x));
}
function pct(v) { return (v === null || v === undefined || !isFinite(Number(v))) ? '—' : fmtDec.format(Number(v)) + '%'; }
function num(v) { return (v === null || v === undefined || !isFinite(Number(v))) ? '—' : fmtARS.format(Number(v)); }
function hoyAR() { return new Date(Date.now() - 3 * 3600000).toISOString().slice(0, 10); }
function sumarDias(iso, d) { const t = new Date(iso + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + d); return t.toISOString().slice(0, 10); }
function fechaCorta(iso) { if (!iso) return '—'; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${y.slice(2)}`; }
function mesLargo(iso) { const [y, m] = String(iso).split('-'); return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][Number(m) - 1] + ' ' + y.slice(2); }
function div(a, b) { return b ? a / b : null; }
function parsearNumero(s) {
  // acepta "3.317", "3317,50", "$ 3.317,5", "3317.5"
  let t = String(s ?? '').replace(/[$\s]/g, '');
  if (!t) return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const x = Number(t);
  return isFinite(x) ? x : NaN;
}

// Fetch robusto con timeout + reintentos (solo ante red/5xx)
// fn: otra Edge Function (ej. la sync de facturación); en ese caso el body va sin "accion".
async function api(accion, payload = {}, { timeout = CONFIG.TIMEOUT_MS, reintentos = CONFIG.REINTENTOS, fn = CONFIG.FN } = {}) {
  let ultimo;
  for (let i = 0; i <= reintentos; i++) {
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), timeout);
    try {
      if (!S.auth) throw new Error('Sesión vencida: volvé a ingresar.');
      const r = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${fn}`, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', Authorization: S.auth, apikey: CONFIG.SUPABASE_ANON_KEY },
        body: JSON.stringify(fn === CONFIG.FN ? { accion, ...payload } : payload),
      });
      let data = null; try { data = await r.json(); } catch (_) {}
      if (r.status === 401) { await sb.auth.signOut(); throw new Error('Sesión vencida o usuario sin acceso.'); }
      if (!r.ok || !data || data.ok === false) {
        const msg = (data && data.error) || `Error ${r.status}`;
        if (r.status >= 500 && i < reintentos) { ultimo = new Error(msg); await esperar(700 * (i + 1)); continue; }
        const e = new Error(msg); e.data = data; throw e;
      }
      return data;
    } catch (e) {
      ultimo = e.name === 'AbortError' ? new Error('La consulta tardó demasiado (timeout).') : e;
      if ((e.name === 'AbortError' || e instanceof TypeError) && i < reintentos) { await esperar(700 * (i + 1)); continue; }
      throw ultimo;
    } finally { clearTimeout(tm); }
  }
  throw ultimo;
}
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- Progreso con tiempo estimado (procesos largos o por tandas) ----------
   - Con total conocido: X/Y y "resta ~Ns" según el ritmo real de lo ya procesado.
   - Sin total (una sola llamada larga): estimado inicial que se va descontando. */
function progresoHtml({ etiqueta, hechos = 0, total = null, t0, estimadoSeg = null }) {
  const seg = (Date.now() - t0) / 1000;
  let resta = null;
  if (total && hechos > 0) resta = Math.max(0, Math.round((seg / hechos) * (total - hechos)));
  else if (estimadoSeg) resta = Math.round(estimadoSeg - seg);
  const ancho = total ? (100 * hechos) / total : estimadoSeg ? Math.min(95, (100 * seg) / estimadoSeg) : 5;
  const cuenta = total !== null ? ` ${num(hechos)}/${num(total)}` : '';
  const txt = seg < 1.5 && estimadoSeg ? `estimado ~${estimadoSeg} s`
    : resta === null ? `${Math.round(seg)} s`
    : resta <= 0 ? `${Math.round(seg)} s · está tardando más de lo normal, sigue trabajando…`
    : `resta ~${resta} s`;
  return `${etiqueta}${cuenta} · ${txt}<div class="barra"><div style="width:${ancho}%"></div></div>`;
}

/* ---------- Ordenamiento genérico de tablas ---------- */
function ordenar(filas, orden) {
  const { col, dir } = orden;
  return [...filas].sort((a, b) => {
    const va = a[col], vb = b[col];
    if (va === vb) return 0;
    if (va === null || va === undefined || va === '') return 1;   // vacíos siempre al final
    if (vb === null || vb === undefined || vb === '') return -1;
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
    return String(va).localeCompare(String(vb), 'es', { numeric: true }) * dir;
  });
}
function th(col, label, orden, numCol = false, ayudaHtml = '') {
  const fl = orden.col === col ? `<span class="flecha">${orden.dir > 0 ? '▲' : '▼'}</span>` : '';

}

function rangoPeriodo() {

    case '30d': return [sumarDias(hoy, -29), hoy];

    case 'mesant': { const ini = new Date(hoy.slice(0, 8) + '01T12:00:00Z'); ini.setUTCMonth(ini.getUTCMonth() - 1); const d = ini.toISOString().slice(0, 10); return [d, sumarDias(hoy.slice(0, 8) + '01', -1)]; }

function opsFiltradas() {
  if (!S.ops) return [];
  return S.soloConfiables ? S.ops.filter((o) => o.costo_confiable) : S.ops;

// Agrega un conjunto de líneas → totales de la cascada
function agregar(lineas) {
  const t = { lineas: lineas.length, ordenes: new Set(), unidades: 0, lista: 0, descuento: 0, bruto: 0, comision: 0, envio: 0, neto: 0,
    costo: 0, brown: 0, embalaje: 0, prorrateo: 0, cargoMl: 0, iibbDesc: 0, iibbTotal: 0, margen: 0, netoConCosto: 0, brutoConCosto: 0, conCosto: 0, confiables: 0, neg: 0, bajo: 0, sinCosto: 0, conDescuento: 0,
    ordenesFlex: new Set(), ordenesFlexEstimadas: new Set(), brownTodo: 0 };
  for (const o of lineas) {
    t.ordenes.add(o.ml_order_id); t.iibbTotal += n(o.iibb_periodo);
    if (o.tipo_envio === 'Flex') { t.ordenesFlex.add(o.ml_order_id); t.brownTodo += n(o.brown); if (o.brown_estimado) t.ordenesFlexEstimadas.add(o.ml_order_id); }
    t.unidades += n(o.units); t.lista += o.lista_total; t.descuento += o.descuento_total; t.bruto += n(o.bruto);
    t.comision += n(o.comision); t.envio += n(o.envio); t.neto += n(o.neto_ml);
    if (o.descuento_total > 0) t.conDescuento++;
    if (o.costo_confiable) t.confiables++;
    if (o.semaforo === 'negativo') t.neg++; else if (o.semaforo === 'bajo') t.bajo++; else if (o.semaforo === 'sin_costo') t.sinCosto++;
    if (o.costo_completo) {
      t.conCosto++; t.costo += n(o.costo_total); t.brown += n(o.brown); t.embalaje += n(o.embalaje);
      t.prorrateo += n(o.prorrateo_facturas); t.cargoMl += n(o.cargo_ml_periodo); if (o.iibb_descontado) t.iibbDesc += n(o.iibb_periodo);
      t.margen += n(o.margen); t.netoConCosto += n(o.neto_ml); t.brutoConCosto += n(o.bruto);
    }
  }
  t.ordenes = t.ordenes.size; t.flex = t.ordenesFlex.size; t.flexEstimadas = t.ordenesFlexEstimadas.size;
  delete t.ordenesFlex; delete t.ordenesFlexEstimadas;
  t.brownProm = t.flex ? t.brownTodo / t.flex : null;
  // con neto ≤ 0 el % sobre neto no tiene sentido (daría >100% o signo invertido)
  t.margenPctNeto = t.netoConCosto > 0 ? 100 * t.margen / t.netoConCosto : null;
  t.margenPctPrecio = t.brutoConCosto > 0 ? 100 * t.margen / t.brutoConCosto : null;
  t.comisionPct = t.bruto ? 100 * t.comision / t.bruto : null;
  t.envioProm = t.ordenes ? t.envio / t.ordenes : null;
  t.descuentoPct = t.lista ? 100 * t.descuento / t.lista : null;
  t.coberturaConfiable = t.lineas ? 100 * t.confiables / t.lineas : null;
  t.margenPorUnidad = t.unidades ? t.margen / t.unidades : null;
  return t;
}
function agruparPor(lineas, claveFn, labelFn) {
  const m = new Map();
  for (const o of lineas) { const k = claveFn(o); if (!m.has(k)) m.set(k, []); m.get(k).push(o); }
  return [...m.entries()].map(([k, ls]) => {
    const t = agregar(ls);
    return { clave: k, label: labelFn ? labelFn(ls[0], k) : k, ...t, precioProm: t.unidades ? t.bruto / t.unidades : null, ultima: ls.reduce((a, o) => (o.fecha > a ? o.fecha : a), '') };
  });
}

      key: 'k_iibb', que: 'Percepciones de Ingresos Brutos (CABA, Bs. As., Tucumán, Salta, Catamarca, Neuquén, Corrientes…) que ML te cobra en su factura mensual.', calculo: 'Cargos de impuestos de la factura de ML − bonificaciones de percepciones en notas de crédito, prorrateado por facturación entre las ventas del período.', fuente: 'API de facturación de ML. Decisión pendiente: ¿son costo o pago a cuenta? (⚙️ Ajustes).' })}

  </div>

  <div class="grid2">
    <section class="card"><h2>Cascada del período ${ayudaInline('c_cas', 'Cómo se va del precio de lista al margen real, sumando todas las líneas del período.', 'Cada barra resta (o es un subtotal) sobre la anterior. Los porcentajes son sobre el precio de lista.', 'Mismas líneas que los KPIs.')}</h2>
      ${cascadaHtml({ lista: t.lista, descuento: t.descuento, bruto: t.bruto, comision: t.comision, envio: t.envio, neto: t.neto, costo: t.costo, brown: t.brown, embalaje: t.embalaje, prorrateo: t.prorrateo, cargoMl: t.cargoMl, iibbDesc: t.iibbDesc, iibbPend: iibbPendiente(t), margen: t.margen, sinCosto: t.conCosto < t.lineas, sinVenta })}

    <section class="card"><h2>Margen real por mes ${ayudaInline('c_mes', 'Margen real de cada mes del período (pasá el dedo o el mouse por las barras para ver el detalle).', 'Misma fórmula que el KPI de margen, agrupado por mes de venta (hora Argentina).', 'Importes NOMINALES en ARS: no compares meses sin tener en cuenta la inflación.')}

function cascadaHtml(c) {
  const base = Math.max(c.lista, c.bruto, 1);
  const pasos = [
    { lbl: 'Precio de lista', v: c.lista, tipo: 'total' },
    { lbl: '− Descuentos', v: -c.descuento, opc: true },
    { lbl: 'Cobrado (bruto)', v: c.bruto, tipo: 'sub' },
    { lbl: '− Comisión ML', v: -c.comision },
    { lbl: '− Envío', v: -c.envio },
    { lbl: 'Neto ML', v: c.neto, tipo: 'sub' },
    { lbl: '− Costo mercadería', v: -c.costo },
    { lbl: '− Logística Flex', v: -c.brown, opc: true },
    { lbl: '− Embalaje', v: -c.embalaje, opc: true },
    { lbl: '− Facturas ML (manual)', v: -c.prorrateo, opc: true },
    { lbl: c.cargoMl >= 0 ? '− Facturación ML' : '+ Bonif. facturación ML', v: -(c.cargoMl || 0), opc: true },
    { lbl: '− Percepciones IIBB', v: -(c.iibbDesc || 0), opc: true },
    { lbl: 'Margen real', v: c.margen, tipo: 'fin' },
  ];
  // Costos del período que no pertenecen a ninguna venta (envíos de ventas canceladas)
  if (c.sinVenta) pasos.push({ lbl: '− Envíos cancelados', v: -c.sinVenta }, { lbl: 'Margen del período', v: c.margen - c.sinVenta, tipo: 'fin' });
  let corriente = 0; let html = '';
  for (const p of pasos) {
    if (p.opc && !p.v) continue;
    let izq, ancho, clase;
    if (p.tipo) { corriente = p.v; izq = Math.min(0, p.v); ancho = Math.abs(p.v); clase = p.tipo === 'fin' ? (p.v >= 0 ? 'fin-pos' : 'fin-neg') : 'sub'; }
    else { const desde = corriente; corriente += p.v; izq = Math.min(desde, corriente); ancho = Math.abs(p.v); clase = 'res'; }
    const l = Math.max(0, (izq / base) * 100), w = Math.max(0.4, (ancho / base) * 100);
    html += `<div class="cas-fila ${p.tipo ? 'total' : ''}"><div class="lbl">${p.lbl}</div>
      <div class="cas-pista"><div class="cas-bar ${clase}" style="left:${l}%;width:${Math.min(w, 100 - l)}%"></div></div>
      <div class="val">${plata(p.v)}<span class="pct">${pct(base ? 100 * p.v / base : null)}</span></div></div>`;
  }
  if (c.iibbPend) html += `<div class="aviso warn" style="margin:8px 0 0"><span class="ico">❓</span><div><b>Percepciones IIBB sin descontar: ${plata(c.iibbPend)}</b> — incógnita a definir con el contador. Si fueran costo, el margen quedaría en <b>${plata(c.margen - c.iibbPend)}</b>.</div></div>`;
  if (c.sinCosto) html += `<div class="mute" style="font-size:11.5px;margin-top:6px">Las líneas sin costo suman en lista/bruto/neto pero no en costo ni margen.</div>`;
  return `<div class="cascada">${html}</div>`;
}

function montarGraficoMensual() {
  const el = $('chartMes'); if (!el || !S.ops) return;
  const meses = ordenar(agruparPor(opsFiltradas(), (o) => String(o.mes).slice(0, 7)), { col: 'clave', dir: 1 });
  if (!meses.length) { el.innerHTML = estadoVacio('Sin datos'); return; }
  const W = el.clientWidth || 500, H = el.clientHeight || 240, pl = 54, pr = 8, pt = 10, pb = 26;
  // escala con marcas "redondas" (1, 2, 2.5, 5 × 10^n)
  const vMax = Math.max(0, ...meses.map((m) => m.margen)), vMin = Math.min(0, ...meses.map((m) => m.margen));
  const bruto = ((vMax - vMin) || 1) / 4, mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const stepT = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => s >= bruto);
  const min = Math.floor(vMin / stepT) * stepT, max = Math.ceil(vMax / stepT) * stepT || stepT;
  const rango = (max - min) || 1;
  const y = (v) => pt + (max - v) / rango * (H - pt - pb);
  const paso = (W - pl - pr) / meses.length, bw = Math.max(4, Math.min(46, paso - 6));
  let grid = '';
  for (let v = min; v <= max + stepT / 2; v += stepT) { const yy = y(v); grid += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 6}" y="${yy + 3}" text-anchor="end">${abreviar(v)}</text>`; }
  let barras = '';
  meses.forEach((m, i) => {
    const x = pl + i * paso + (paso - bw) / 2, y0 = y(0), y1 = y(m.margen);
    const top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0));
    // barra con extremo de datos redondeado (4px) anclada a la base
    const r = Math.min(4, h, bw / 2);
    const d = m.margen >= 0
      ? `M${x},${y0} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${y0} Z`
      : `M${x},${y0} V${top + h - r} Q${x},${top + h} ${x + r},${top + h} H${x + bw - r} Q${x + bw},${top + h} ${x + bw},${top + h - r} V${y0} Z`;
    barras += `<rect class="hit" data-i="${i}" x="${pl + i * paso}" y="${pt}" width="${paso}" height="${H - pt - pb}"/><path class="bar ${m.margen < 0 ? 'negativa' : ''}" data-b="${i}" d="${d}"/>`;
    if (meses.length <= 14 || i % Math.ceil(meses.length / 12) === 0) barras += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${mesLargo(m.clave)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Margen real por mes"><g class="grid">${grid}</g><line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(168,158,140,.4)"/>${barras}</svg>`;
  const tip = $('tip');
  el.querySelectorAll('.hit').forEach((h) => {
    const mostrar = (ev) => {
      const m = meses[Number(h.dataset.i)];
      el.querySelectorAll('.bar').forEach((b) => b.classList.toggle('hover', b.dataset.b === h.dataset.i));
      tip.innerHTML = `<div class="t-tit">${mesLargo(m.clave)}</div>
        <div class="t-row"><span class="dim">Margen</span><span>${plata(m.margen)}</span></div>
        <div class="t-row"><span class="dim">% s/neto</span><span>${pct(m.margenPctNeto)}</span></div>
        <div class="t-row"><span class="dim">Neto ML</span><span>${plata(m.neto)}</span></div>
        <div class="t-row"><span class="dim">Bruto</span><span>${plata(m.bruto)}</span></div>
        <div class="t-row"><span class="dim">Unidades</span><span>${num(m.unidades)}</span></div>
        <div class="t-row"><span class="dim">Costo confiable</span><span>${pct(m.coberturaConfiable)}</span></div>`;
      tip.classList.remove('oculto');
      const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX), cy = (ev.touches ? ev.touches[0].clientY : ev.clientY);
      tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, cx + 12) + 'px';
      tip.style.top = Math.max(8, cy - tip.offsetHeight - 12) + 'px';
    };
    h.addEventListener('mousemove', mostrar); h.addEventListener('touchstart', mostrar, { passive: true });
    h.addEventListener('mouseleave', () => { tip.classList.add('oculto'); el.querySelectorAll('.bar').forEach((b) => b.classList.remove('hover')); });
  });
}
function abreviar(v) { const a = Math.abs(v); const s = v < 0 ? '−' : ''; if (a >= 1e6) return s + '$' + fmtDec.format(a / 1e6) + 'M'; if (a >= 1e3) return s + '$' + fmtARS.format(a / 1e3) + 'k'; return s + '$' + fmtARS.format(a); }

/* ============================================================
   10. VISTA: OPERACIONES
   ============================================================ */
function opsDeOperaciones() {
  const f = S.opFiltro; const q = f.q.trim().toLowerCase();
  return opsFiltradas().filter((o) =>
    (!q || String(o.sku).toLowerCase().includes(q) || String(o.ml_order_id).includes(q) || String(o.titulo || '').toLowerCase().includes(q) || String(o.item_id || '').toLowerCase().includes(q)) &&
    (f.envio === 'todos' || (f.envio === 'sin' ? !o.tipo_envio : o.tipo_envio === f.envio)) &&
    (f.sem === 'todos' || o.semaforo === f.sem || (f.sem === 'estimado' && o.costo_completo && !o.costo_confiable)));
}
// "Esfera 1" → "Z1" (el mapa de Brown dice Zona 1/2/3; las liquidaciones dicen Esfera)
function zonaCorta(z) { if (!z) return 'sin zona'; const m = /(\d+)\s*$/.exec(z); return m ? 'Z' + m[1] : z; }
function zonaLarga(z) { if (!z) return 'Sin zona'; const m = /(\d+)\s*$/.exec(z); return m ? `Zona ${m[1]}` : z; }

  return `

    <select id="opEnvio">${[['todos','Todos los envíos'],['Flex','Flex'],['Colecta','Colecta'],['Full','Full'],['sin','Sin dato de envío']].map(([v,l]) => `<option value="${v}" ${f.envio===v?'selected':''}>${l}</option>`).join('')}</select>
    <select id="opSem">${[['todos','Todos los semáforos'],['negativo','✕ Negativo'],['bajo','▲ Bajo'],['ok','✓ OK'],['sin_costo','? Sin costo'],['estimado','≈ Costo estimado']].map(([v,l]) => `<option value="${v}" ${f.sem===v?'selected':''}>${l}</option>`).join('')}</select>
    <button class="btn sec chico" data-accion="csvOps">⬇ CSV</button>
  </div>

  ${a.por === 'mes' ? '<div class="aviso warn"><span class="ico">⚠️</span><div>Importes <b>nominales</b>: con inflación, un mes no se compara directo con otro. Mirá sobre todo los <b>porcentajes</b>.</div></div>' : ''}

// Un único lugar define cada agrupación (lo usan la tabla y el CSV). Para sumar una agrupación nueva, agregala acá y en el selector.
function gruposAgrupado(ls, por) {
  switch (por) {
    case 'sku': return agruparPor(ls, (o) => o.sku);
    case 'publicacion': return agruparPor(ls, (o) => o.item_id || '(sin id)', (o) => `${o.titulo || ''}`);
    case 'envio': return agruparPor(ls, (o) => o.tipo_envio || 'Sin dato');
    case 'tipo': return agruparPor(ls, (o) => ({ gold_special: 'Clásica', gold_pro: 'Premium' }[o.listing_type] || o.listing_type || '—'));
    case 'zona': return agruparPor(ls.filter((o) => o.tipo_envio === 'Flex'), (o) => zonaLarga(o.zona_logistica));
    default: return agruparPor(ls, (o) => String(o.mes).slice(0, 7));
  }
}

    ${H('bruto','Bruto',true)}${H('comisionPct','Comisión %',true)}${H('envioProm','Envío/orden',true)}

    ${H('neto','Neto ML',true)}

    ${H('margenPctPrecio','% precio',true, ayudaInline('t_mpp','Margen sobre el precio cobrado.','Margen / bruto (solo líneas con costo).','v_margen_operacion.'))}
    ${H('margenPorUnidad','Margen/u',true)}${H('neg','Alertas',true)}
  </tr></thead><tbody>
  ${filas.map((g) => `<tr>

    ${por === 'publicacion' ? `<td class="titulo dim" title="${esc(g.label)}">${esc(g.label)}</td>` : ''}
    <td class="num">${num(g.unidades)}</td><td class="num">${plata(g.precioProm)}</td><td class="num">${plata(g.bruto)}</td>

    <td class="num">${plata(g.neto)}</td>
    <td class="num">${g.conCosto ? plata(g.costo) : '—'}</td><td class="num ${g.margen < 0 ? 'neg' : ''}">${g.conCosto ? plata(g.margen) : '—'}</td>
    <td class="num ${g.margenPctNeto !== null && g.margenPctNeto < n(S.config.umbral_margen_pct || 15) ? 'neg' : ''}">${pct(g.margenPctNeto)}</td><td class="num">${pct(g.margenPctPrecio)}</td>
    <td class="num">${plata(g.margenPorUnidad)}</td>

  return `

    <span class="sep"></span><span class="dim" style="font-size:12px">Umbral actual: margen &lt; ${pct(umbral)} del neto (editable en ⚙️)</span></div>

    ${kpi({ label: 'Líneas en alerta', valor: num(base.length), sub: `${num(porSku.length)} SKUs`, key: 'a_l', que: 'Ventas con margen negativo o por debajo del umbral.', calculo: `Negativo: margen < 0 · Bajo: margen < ${umbral}% del neto.`, fuente: 'Semáforo de v_margen_operacion.' })}
    ${kpi({ label: 'Pérdida en negativas', valor: plata(tNeg.margen), clase: 'neg', sub: `${num(tNeg.lineas)} líneas`, key: 'a_p', que: 'Plata perdida en las ventas que dieron margen negativo.', calculo: 'Σ margen de las líneas con margen < 0.', fuente: 'v_margen_operacion.' })}
    ${kpi({ label: 'SKUs sin costo', valor: num(sinCosto.length), sub: sinCosto.map((s) => esc(s.clave)).slice(0, 4).join(', '), key: 'a_s', que: 'SKUs vendidos sin ningún costo cargado (no se puede medir su margen).', calculo: 'Sin compras con precio, sin costo manual y sin maestro.', fuente: 'Cargalos en 💲 Costos.' })}
  </div>
  <section class="card"><h2>SKUs en alerta (peor primero)</h2>
  ${porSku.length ? `<div class="tabla-wrap"><table><thead><tr><th>SKU</th><th class="num">Líneas</th><th class="num">Unid.</th><th class="num">Precio prom.</th><th class="num">Comisión %</th><th class="num">Envío/orden</th><th class="num">Costo</th><th class="num">Margen</th><th class="num">% neto</th><th>Causa probable</th><th></th></tr></thead><tbody>
    ${porSku.map((g) => `<tr><td class="mono">${esc(g.clave)}</td><td class="num">${g.lineas}</td><td class="num">${g.unidades}</td><td class="num">${plata(g.precioProm)}</td>
      <td class="num">${pct(g.comisionPct)}</td><td class="num">${plata(g.envioProm)}</td><td class="num">${plata(g.costo)}</td><td class="num ${g.margen < 0 ? 'neg' : ''}">${plata(g.margen)}</td>
      <td class="num">${pct(g.margenPctNeto)}</td><td class="dim" style="white-space:normal;min-width:180px">${causaProbable(g)}</td>
      <td><button class="btn sec chico" data-accion="calcDesdeOp" data-sku="${esc(g.clave)}">🧮</button></td></tr>`).join('')}
  </tbody></table></div>` : estadoVacio('Sin alertas en el período 🎉')}
  </section>`;
}
function causaProbable(g) {
  const c = [];
  if (g.bruto && g.envio / g.bruto > 0.25) c.push(`envío = ${pct(100 * g.envio / g.bruto)} del precio`);
  if (g.comisionPct > 25) c.push(`comisión alta (${pct(g.comisionPct)}: Premium/cuotas o costo fijo)`);
  if (g.netoConCosto && g.costo / g.netoConCosto > 0.85) c.push('costo casi igual al neto: precio bajo');
  if (g.lista && g.descuento / g.lista > 0.1) c.push(`descuento ${pct(100 * g.descuento / g.lista)}`);
  return c.length ? c.join(' · ') : 'revisar precio vs costo';
}

function vistaCostos() {

  if (S.costosError) return estadoError(S.costosError, 'recargarCostos');
  if (!S.costos) return estadoCarga();
  const { vigentes = [], manuales = [], reglas = [], proveedores = [] } = S.costos;
  const v = S.costosVista; const q = v.q.trim().toLowerCase();
  const lista = vigentes.map((x) => ({ ...x, costo: x.costo === null ? null : Number(x.costo), costo_maestro: x.costo_maestro === null ? null : Number(x.costo_maestro), dif_vs_maestro_pct: x.dif_vs_maestro_pct === null ? null : Number(x.dif_vs_maestro_pct), antiguedad_dias: x.antiguedad_dias === null ? null : Number(x.antiguedad_dias) }))
    .filter((x) => (!q || String(x.sku).toLowerCase().includes(q) || String(x.proveedor || '').toLowerCase().includes(q)) && (!v.soloDif || Math.abs(x.dif_vs_maestro_pct || 0) >= 3));
  const conDif = vigentes.filter((x) => Math.abs(Number(x.dif_vs_maestro_pct || 0)) >= 3).length;
  const viejos = vigentes.filter((x) => !x.es_kit && Number(x.antiguedad_dias) > n(S.config.costo_max_antiguedad_dias || 120)).length;
  const provNombre = Object.fromEntries(proveedores.map((p) => [p.id, p.nombre]));
  const c = S.carga;
  return `
  <div class="kpis">
    ${kpi({ label: 'SKUs con costo', valor: num(vigentes.filter((x) => x.costo !== null).length), sub: `de ${num(vigentes.length)}`, key: 'c_n', que: 'SKUs (base y kits) con un costo calculable hoy.', calculo: 'Kits: todos sus componentes deben tener costo.', fuente: 'v_margen_costos_vigentes.' })}
    ${kpi({ label: 'Difieren del maestro', valor: num(conDif), sub: '±3% o más', key: 'c_d', que: 'SKUs cuyo costo real difiere del costo cargado en el Excel maestro.', calculo: '(costo real − costo maestro) / costo maestro.', fuente: 'productos_costo vs compras/manual.' })}
    ${kpi({ label: 'Costo viejo', valor: num(viejos), sub: `> ${n(S.config.costo_max_antiguedad_dias || 120)} días`, key: 'c_v', que: 'SKUs base cuyo último costo con precio tiene muchos días.', calculo: 'Hoy − fecha de la compra/costo manual usado.', fuente: 'Cargá la lista nueva del proveedor abajo.' })}
    ${kpi({ label: 'Costos manuales', valor: num(manuales.length), key: 'c_m', que: 'Costos cargados a mano con fecha de vigencia.', calculo: 'Pisan a la última compra desde su fecha, hasta que entre una compra más nueva.', fuente: 'costos_sku_manual.' })}
  </div>

  <section class="card"><h2>Cargar lista / costos nuevos ${ayudaInline('c_carga','Pegá SKU y valor (uno por línea). Sirve para cargar la lista nueva de un proveedor sin esperar a la próxima compra.','Modo lista: costo = lista × (1+IVA) × (1−desc. propio) según la regla del proveedor (si el proveedor no tiene regla de lista, se toma tal cual). Modo costo final: se usa tal cual.','Se guarda en costos_sku_manual con la fecha de vigencia.')}</h2>
    ${!S.puedeEditar ? '<div class="aviso warn"><span class="ico">🔒</span><div>Tu usuario no tiene permiso para editar costos.</div></div>' : ''}
    <div class="form-grid">
      <div class="campo"><label>Qué vas a pegar</label><select id="cgModo"><option value="lista" ${c.modo==='lista'?'selected':''}>Precio de lista s/IVA (aplica regla)</option><option value="final" ${c.modo==='final'?'selected':''}>Costo final (tal cual)</option></select></div>
      <div class="campo"><label>Vigente desde</label><input type="date" id="cgVig" value="${c.vigencia || hoyAR()}"></div>
      <div class="campo"><label>Proveedor (opcional)</label><select id="cgProv"><option value="">El de la última compra de cada SKU</option>${proveedores.filter((p) => p.activo !== false).map((p) => `<option value="${p.id}" ${c.proveedor===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>

function prepararPreviewCarga() {
  const c = S.carga; const { vigentes = [], reglas = [], proveedores = [] } = S.costos || {};
  const porSku = Object.fromEntries(vigentes.map((x) => [String(x.sku), x]));
  const provPorNombre = Object.fromEntries(proveedores.map((p) => [p.nombre, p.id]));
  const reglaPorProv = Object.fromEntries(reglas.map((r) => [r.proveedor_id, r]));
  const vistos = new Set();
  return c.texto.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((linea, i) => {
    const partes = linea.split(/[\t;]+|\s{1,}/).filter(Boolean);
    const sku = (partes[0] || '').trim(); const valor = parsearNumero(partes.slice(1).join(''));
    const v = porSku[sku];
    const fila = { linea: i + 1, sku, valor, ok: true, nota: '' };
    if (!sku) return { ...fila, ok: false, nota: 'sin SKU' };
    if (valor === null || isNaN(valor) || valor <= 0) return { ...fila, ok: false, nota: 'valor inválido' };
    if (vistos.has(sku)) return { ...fila, ok: false, nota: 'SKU repetido en el pegado' };
    vistos.add(sku);
    if (v && v.es_kit) return { ...fila, ok: false, nota: 'es un kit: cargá el costo de sus componentes' };
    const provId = c.proveedor || (v && v.proveedor ? provPorNombre[v.proveedor] : null);
    const r = provId ? reglaPorProv[provId] : null;
    // Mismo criterio que margen_costo_base(): sin regla de lista → el valor se toma tal cual
    const conRegla = c.modo === 'lista' && r && r.metodo === 'lista_iva_desc';
    const f4 = (x) => Number(x).toLocaleString('es-AR', { maximumFractionDigits: 4 });
    fila.costo = conRegla ? valor * (1 + Number(r.iva)) * (1 - Number(r.desc_propio)) : valor;
    fila.formula = c.modo === 'final' ? 'tal cual' : conRegla ? `× ${f4(1 + Number(r.iva))} × ${f4(1 - Number(r.desc_propio))}` : 'tal cual (proveedor sin regla de lista)';
    fila.actual = v && v.costo !== null ? Number(v.costo) : null;
    fila.dif = fila.actual ? 100 * (fila.costo - fila.actual) / fila.actual : null;
    if (!v) fila.nota = 'SKU nuevo (no figura en compras ni maestro)';
    else if (fila.dif !== null && Math.abs(fila.dif) >= 40) fila.nota = '⚠️ cambio grande: revisá el valor';
    return fila;
  });
}

async function guardarCargaCostos() {
  const c = S.carga; if (!c.preview || c.corriendo) return;
  const items = c.preview.filter((f) => f.ok).map((f) => ({
    sku: f.sku, vigente_desde: c.vigencia || hoyAR(), proveedor_id: c.proveedor || null,
    precio_lista: c.modo === 'lista' ? f.valor : null, costo_final: c.modo === 'final' ? f.valor : null, nota: 'carga masiva desde app márgenes',
  }));
  if (!items.length) return;
  c.corriendo = true; render();
  const tandas = []; for (let i = 0; i < items.length; i += CONFIG.TANDA_COSTOS) tandas.push(items.slice(i, i + CONFIG.TANDA_COSTOS));
  const t0 = Date.now(); let hechos = 0; const errores = [];
  const prog = (txt) => { const el = $('cgProgreso'); if (el) el.innerHTML = txt; };
  const estimadoIni = Math.max(1, Math.round(tandas.length * 1.2));
  prog(`Guardando 0/${items.length} · estimado ~${estimadoIni} s<div class="barra"><div style="width:0%"></div></div>`);
  for (const t of tandas) {
    try { const r = await api('costos_manual_guardar', { items: t }); (r.errores || []).forEach((e) => errores.push(e)); }
    catch (e) { t.forEach((x) => errores.push({ sku: x.sku, error: e.message })); }
    hechos += t.length;
    const ritmo = (Date.now() - t0) / hechos; const resta = Math.round((items.length - hechos) * ritmo / 1000);
    prog(`Guardando ${hechos}/${items.length} · resta ~${resta} s<div class="barra"><div style="width:${100 * hechos / items.length}%"></div></div>`);
  }
  c.corriendo = false;
  if (errores.length) toast(`Guardado con ${errores.length} error(es): ${errores.slice(0, 3).map((e) => e.sku + ' ' + e.error).join(' · ')}`, 'err');
  else { toast(`✓ ${items.length} costos guardados`, 'ok'); c.preview = null; c.texto = ''; }
  S.ops = null; S.stock = null; // el margen y el stock cambian con los costos nuevos
  await cargarCostos(true);
}

function leerCalc() {
  const g = (id) => { const el = $(id); return el ? el.value : ''; };
  Object.assign(CALC, { sku: g('ccSku'), costo: g('ccCosto'), comision: g('ccCom'), fijo: g('ccFijo'), envio: g('ccEnv'), otros: g('ccOtros'), modo: g('ccModo'), objetivo: g('ccObj'), promo: g('ccPromo') });
}
function precargarCalcSku(sku) {
  CALC.sku = sku;
  const ls = (S.ops || []).filter((o) => String(o.sku) === String(sku));
  if (ls.length) {
    const t = agregar(ls); const ult = ls.reduce((a, o) => (!a || o.sale_date > a.sale_date ? o : a), null);
    CALC.costo = ult && ult.costo_unit !== null ? Math.round(ult.costo_unit) : CALC.costo;
    CALC.comision = t.comisionPct !== null ? Math.round(t.comisionPct * 10) / 10 : CALC.comision;
    CALC.envio = t.envioProm !== null ? Math.round(t.envioProm) : CALC.envio;
    CALC.fijo = 0;
    // otros por venta = lo que hoy ya descuenta la vista en promedio (Brown + embalaje + facturas)
    const otros = t.conCosto ? (t.brown + t.embalaje + t.prorrateo + t.cargoMl + t.iibbDesc) / t.conCosto : 0;
    CALC.otros = otros ? Math.round(otros) : '';
    toast(`Precargado ${sku}: ${ls.length} ventas del período`, 'ok');
  } else toast('Ese SKU no tiene ventas en el período elegido: completá a mano.', 'err');
}
function calcularPrecioPiso() {
  const el = $('ccRes'); if (!el) return;
  const costo = n(CALC.costo), c = n(CALC.comision) / 100, fijo = n(CALC.fijo), env = n(CALC.envio), otros = n(CALC.otros), obj = n(CALC.objetivo), promo = n(CALC.promo) / 100;
  if (!(costo > 0)) { el.innerHTML = estadoVacio('Cargá al menos el costo de mercadería.'); return; }
  if (c >= 0.95) { el.innerHTML = estadoError('La comisión no puede ser ≥ 95%.'); return; }
  const fijos = costo + otros; // lo que sale después del neto
  let P;
  if (CALC.modo === 'pesos') P = (fijos + obj + fijo + env) / (1 - c);
  else if (CALC.modo === 'pct_precio') { const m = obj / 100; if (1 - c - m <= 0) { el.innerHTML = estadoError('Objetivo imposible: comisión + margen ≥ 100% del precio.'); return; } P = (fijos + fijo + env) / (1 - c - m); }
  else { const m = obj / 100; if (m >= 1) { el.innerHTML = estadoError('El margen sobre el neto tiene que ser < 100%.'); return; } P = ((fijos / (1 - m)) + fijo + env) / (1 - c); }
  const Peq = (fijos + fijo + env) / (1 - c);
  const comision = P * c + fijo, neto = P - comision - env, margen = neto - costo - otros;
  const lista = promo > 0 && promo < 1 ? P / (1 - promo) : null;
  el.innerHTML = `
    <div class="dim" style="font-size:12px">Precio cobrado mínimo ${ayudaInline('p_r','Precio al que tiene que quedar la venta (después de la promo) para cumplir el objetivo.','Se despeja de: neto = P × (1 − comisión%) − cargo fijo − envío; margen = neto − costo − otros.','Valores cargados a la izquierda.')}</div>
    <div class="calc-res">${plata(Math.ceil(P))}</div>
    ${lista ? `<div style="margin-top:4px">Precio de lista sugerido con ${pct(promo * 100)} de promo: <b class="mono">${plata(Math.ceil(lista))}</b></div>` : ''}
    <div class="dim" style="margin:4px 0 14px">Equilibrio (margen $0): <b class="mono">${plata(Math.ceil(Peq))}</b> ${ayudaInline('p_eq','Precio por debajo del cual perdés plata en cada venta.','(costo + otros + cargo fijo + envío) / (1 − comisión%).','Valores cargados.')}</div>
    ${cascadaHtml({ lista: lista || P, descuento: lista ? lista - P : 0, bruto: P, comision, envio: env, neto, costo, brown: 0, embalaje: otros, prorrateo: 0, margen })}
    <div class="mute" style="font-size:11.5px;margin-top:10px">Ojo: el envío a cargo de ML cambia según el precio (umbral de envío gratis) y la comisión según el tipo de publicación y las cuotas. Precios sin redondear a tu escala comercial. No modifica nada en ML.</div>`;
}

/* ---------- 16.2 Logística Flex ---------- */
const ordenZona = (a, b) => (a === 'CABA' ? -1 : b === 'CABA' ? 1 : String(a).localeCompare(String(b), 'es', { numeric: true }));
const esProvisoria = (x) => /PROVISORI/i.test(String(x && x.nota || ''));
function tarifaVigente(tarifas, zona, fecha = hoyAR()) {
  return tarifas.filter((t) => t.zona === zona && t.vigente_desde <= fecha).sort((a, b) => b.vigente_desde.localeCompare(a.vigente_desde))[0] || null;
}
function periodosConciliacion(conc) {
  const m = new Map();
  for (const f of conc) {
    const k = f.desde + '|' + f.hasta;
    if (!m.has(k)) m.set(k, { desde: f.desde, hasta: f.hasta, filas: [], envLiq: 0, envCalc: 0, totLiq: 0, totCalc: 0, canceladas: 0, sinZona: 0 });
    const p = m.get(k); p.filas.push(f);
    p.envLiq += n(f.envios_liquidados); p.envCalc += n(f.envios_calculados);
    p.totLiq += n(f.total_liquidado); p.totCalc += n(f.envios_calculados) * n(f.tarifa);
    p.canceladas += n(f.de_ventas_canceladas); p.sinZona = Math.max(p.sinZona, n(f.sin_zona_en_rango));
  }
  return [...m.values()].sort((a, b) => b.desde.localeCompare(a.desde)).map((p) => ({ ...p, filas: p.filas.sort((a, b) => ordenZona(a.zona, b.zona)) }));
}

  const lv = S.logVista;

  const mapeoFiltrado = mapeo.filter((m) => !qm || String(m.clave).includes(qm) || String(m.partido || '').includes(qm) || zonaLarga(m.zona).toUpperCase().includes(qm));

/* ---------- 16.3 Facturación ML ---------- */
function ajFacturacion() {
  if (S.facCargando && !S.facturacion) return estadoCarga('Cargando facturación de ML…', S.facInicio);
  if (S.facError) return estadoError(S.facError, 'recargarFac');
  if (!S.facturacion) return estadoCarga();

async function syncDestinos() {
  const lv = S.logVista; if (lv.sync && lv.sync.corriendo) return;
  lv.sync = { corriendo: true, etiqueta: 'Sincronizando destinos Flex', hechos: 0, total: null, t0: Date.now(), estimadoSeg: 15 };
  render();
  const tick = setInterval(() => pintar('syncDestProg', progresoHtml(lv.sync)), 1000);
  let errores = 0;
  try {
    for (let i = 0; i < CONFIG.DESTINOS_MAX_TANDAS; i++) {
      const r = await api('destinos_sync', {}, { timeout: 125000, reintentos: 0 });
      errores += n(r.errores);
      if (lv.sync.total === null) lv.sync.total = n(r.procesadas) + n(r.pendientes_restantes);
      lv.sync.hechos += n(r.procesadas);
      pintar('syncDestProg', progresoHtml(lv.sync));
      if (!n(r.pendientes_restantes) || !n(r.procesadas)) break;
    }
    toast(lv.sync.total ? `✓ ${num(lv.sync.hechos)} destinos actualizados${errores ? ` · ${errores} con error` : ''}` : '✓ Ya estaba todo sincronizado', errores ? 'err' : 'ok');
  } catch (e) { toast('⚠️ Sync de destinos: ' + e.message, 'err'); }
  finally { clearInterval(tick); lv.sync = null; }
  S.ops = null; await cargarLogistica(true);
}
async function syncBilling() {
  if (S.facSync) return;
  S.facSync = { etiqueta: 'Sincronizando facturación ML (2 períodos)', t0: Date.now(), estimadoSeg: CONFIG.BILLING_SYNC_SEG_ESTIMADOS };
  render();
  const tick = setInterval(() => pintar('facSyncProg', progresoHtml(S.facSync)), 1000);
  try {
    const r = await api(null, { periodos: 2 }, { fn: CONFIG.FN_BILLING_SYNC, timeout: CONFIG.BILLING_SYNC_TIMEOUT_MS, reintentos: 0 });
    toast(`✓ Facturación sincronizada: ${(r.periodos || []).map((p) => mesLargo(p.key)).join(', ') || 'sin cambios'}`, 'ok');
  } catch (e) {
    const parcial = e.data && e.data.periodos && e.data.periodos.length;
    toast(`⚠️ ${parcial ? 'Sync parcial: ' : ''}${e.data && e.data.errores && e.data.errores[0] ? e.data.errores[0].error : e.message}`, 'err');
  } finally { clearInterval(tick); S.facSync = null; }
  S.ops = null; await cargarFacturacion(true);
}
// Tras cualquier cambio de logística: el margen de las ventas Flex cambia → se recalcula al volver a Resumen
async function trasCambioLogistica(msg) { toast(msg, 'ok'); S.ops = null; await cargarLogistica(true); }
async function accionLogistica(acc, b) {
  switch (acc) {
    case 'asignarZona': {
      const i = b.dataset.i; const clave = $('szClave_' + i)?.value, zona = $('szZona_' + i)?.value;
      if (!clave || !zona) { toast('Elegí el dato y la zona', 'err'); return; }
      await api('zona_guardar', { clave, zona, nota: 'asignada desde la cola sin zona' });
      return trasCambioLogistica(`✓ ${clave} → ${zonaLarga(zona)}`);
    }
    case 'guardarZonaManual': {
      const clave = $('mzClave').value.trim(), zona = $('mzZona').value, vig = $('mzVig').value, partido = $('mzPartido').value.trim();
      if (!clave || !zona) { toast('Completá lugar y zona', 'err'); return; }
      await api('zona_guardar', { clave, zona, vigente_desde: vig || null, partido: partido || null });
      return trasCambioLogistica(`✓ ${clave} agregado al mapa`);
    }
    case 'borrarZona':
      return confirmar('Se borra esta regla del mapa de zonas. Los envíos que la usaban pueden quedar “sin zona”.', async () => { await api('zona_borrar', { id: Number(b.dataset.id) }); await trasCambioLogistica('Regla borrada'); }, 'Borrar');
    case 'guardarZonaDef': {
      const r = await api('config_guardar', { logistica_zona_default: $('lgZonaDef').value || null });
      S.config = r.config; return trasCambioLogistica('✓ Zona por defecto guardada');
    }
    case 'guardarTarifa': {
      let zona = $('trZona').value; if (zona === '__nueva') zona = $('trZonaNueva').value.trim();
      const tarifa = parsearNumero($('trTarifa').value), vig = $('trVig').value;
      if (!zona || !(tarifa >= 0) || !vig) { toast('Completá zona, tarifa y fecha', 'err'); return; }
      return confirmar(`Se guarda <b>${esc(zonaLarga(zona))} = ${plata(tarifa)}</b> desde el <b>${fechaCorta(vig)}</b>. Cambia el costo logístico de los envíos entregados desde esa fecha (si ya existía una tarifa con esa misma fecha, se reemplaza).`,
        async () => { await api('tarifa_guardar', { zona, tarifa, vigente_desde: vig, nota: $('trNota').value }); await trasCambioLogistica('✓ Tarifa guardada'); }, 'Guardar tarifa');
    }
    case 'borrarTarifa':
      return confirmar(`Se borra la tarifa de <b>${esc(zonaLarga(b.dataset.zona))}</b> vigente desde ${fechaCorta(b.dataset.vig)}. Los envíos de esas fechas pasan a usar la tarifa anterior.`,
        async () => { await api('tarifa_borrar', { zona: b.dataset.zona, vigente_desde: b.dataset.vig }); await trasCambioLogistica('Tarifa borrada'); }, 'Borrar');
    case 'guardarLiq': {
      const desde = $('lqDesde').value, hasta = $('lqHasta').value;
      if (!desde || !hasta || hasta < desde) { toast('Rango de fechas inválido', 'err'); return; }
      const filas = []; let i = 0;
      while ($('lqZona_' + i)) {
        const env = $('lqEnv_' + i).value === '' ? 0 : parsearNumero($('lqEnv_' + i).value), tar = parsearNumero($('lqTar_' + i).value);
        if (!Number.isInteger(env) || env < 0 || !(tar >= 0)) { toast(`Revisá la fila de ${zonaLarga($('lqZona_' + i).value)}`, 'err'); return; }
        filas.push({ zona: $('lqZona_' + i).value, envios: env, tarifa: tar }); i++;
      }
      const total = filas.reduce((a, f) => a + f.envios * f.tarifa, 0);
      return confirmar(`Se guarda la liquidación del <b>${fechaCorta(desde)}</b> al <b>${fechaCorta(hasta)}</b>: ${num(filas.reduce((a, f) => a + f.envios, 0))} envíos por <b>${plata(total)}</b>. No cambia el margen: sirve para controlar contra lo calculado.`,
        async () => { await api('liquidacion_guardar', { desde, hasta, filas }); S.logVista.liqDesde = ''; S.logVista.liqHasta = ''; await trasCambioLogistica('✓ Liquidación guardada'); }, 'Guardar');
    }
    case 'borrarLiq':
      return confirmar(`Se borra la liquidación del ${fechaCorta(b.dataset.desde)} al ${fechaCorta(b.dataset.hasta)}.`, async () => { await api('liquidacion_borrar', { desde: b.dataset.desde, hasta: b.dataset.hasta }); await trasCambioLogistica('Liquidación borrada'); }, 'Borrar');
    case 'guardarIibb': {
      const r = await api('config_guardar', { iibb_tratamiento: $('fiTrat').value });
      S.config = r.config; S.ops = null; toast('✓ Tratamiento de IIBB guardado: el margen se recalcula', 'ok'); render(); return;
    }
  }
}

  <h4>Ojo con la inflación</h4><p>Todos los importes son <b>nominales en pesos</b>. Para comparar meses mirá los <b>porcentajes</b>, no los montos.</p>
  <p class="mute" style="font-size:12px">Versión ${CONFIG.APP_VERSION}</p></div>`);
}

/* ============================================================
   18. CSV
   ============================================================ */
function descargarCsv(nombre, filas, cols) {
  const sep = ';';
  const cel = (v) => { const s = v === null || v === undefined ? '' : (typeof v === 'number' ? String(v).replace('.', ',') : String(v)); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const txt = '﻿' + [cols.map((c) => c[1]).join(sep), ...filas.map((f) => cols.map((c) => cel(typeof c[0] === 'function' ? c[0](f) : f[c[0]])).join(sep))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = `${hoyAR()}_${nombre}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================================================
   19. EVENTOS
   ============================================================ */
document.addEventListener('click', async (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.cerrarFondo && t === ev.target && t.classList.contains('modal-fondo')) { $('modalRaiz').innerHTML = ''; return; }
  const tab = t.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; guardarPrefs(); render(); window.scrollTo(0, 0); asegurarDatos(); return; }
  const ir = t.closest('[data-ir]'); if (ir) { S.tab = ir.dataset.ir; guardarPrefs(); render(); asegurarDatos(); return; }
  const per = t.closest('[data-periodo]'); if (per) { S.periodo = per.dataset.periodo; guardarPrefs(); renderBarraPeriodo(); if (S.periodo !== 'custom') cargarOps(); return; }
  const ag = t.closest('[data-agrup]'); if (ag) { S.agrup.por = ag.dataset.agrup; guardarPrefs(); render(); return; }
  const ajs = t.closest('[data-ajsub]'); if (ajs) { S.ajSub = ajs.dataset.ajsub; guardarPrefs(); render(); asegurarDatos(); return; }
  const irAj = t.closest('[data-ir-aj]'); if (irAj) { ev.preventDefault(); S.tab = 'ajustes'; S.ajSub = irAj.dataset.irAj; guardarPrefs(); render(); window.scrollTo(0, 0); asegurarDatos(); return; }
  const thO = t.closest('th[data-orden]');
  if (thO && !t.closest('.ayuda')) {
    const col = thO.dataset.orden;
    const orden = S.tab === 'operaciones' ? S.opFiltro.orden : S.tab === 'agrupado' ? S.agrup.orden : S.tab === 'costos' ? S.costosVista.orden : S.tab === 'stock' ? S.stockVista.orden : null;
    if (orden) { cambiarOrden(orden, col); render(); }
    return;
  }
  const fila = t.closest('tr[data-op]'); if (fila && !t.closest('a')) { abrirDetalleOp(fila.dataset.op); return; }
  const b = t.closest('[data-accion]'); if (!b) return;
  const acc = b.dataset.accion;
  try {
    if (ACCIONES_LOGISTICA.includes(acc)) { await accionLogistica(acc, b); return; }
    switch (acc) {
      case 'recargarLog': await cargarLogistica(true); break;
      case 'toggleHistTarifas': S.logVista.verHist = !S.logVista.verHist; render(); break;
      case 'recargarFac': await cargarFacturacion(true); break;
      case 'syncDestinos': await syncDestinos(); break;
      case 'syncBilling': await syncBilling(); break;
      case 'verConceptos': await cargarFacturacion(true, b.dataset.key === S.facKey ? null : b.dataset.key); break;
      case 'recargar': S.ops = null; await cargarOps(true); break;
      case 'recargarCostos': await cargarCostos(true); break;
      case 'recargarStock': await cargarStock(true); break;
      case 'recargarFacturas': pintar('facturasLista', estadoCarga('Cargando facturas…')); await pintarFacturas(true); break;
      case 'cerrarModal': $('modalRaiz').innerHTML = ''; break;
      case 'confirmarOk': { const f = confirmarPendiente; confirmarPendiente = null; $('modalRaiz').innerHTML = ''; if (f) await f(); break; }
      case 'masOps': S.opFiltro.limite += CONFIG.FILAS_POR_PAGINA; render(); break;
      case 'csvOps': descargarCsv('margenes_operaciones', ordenar(opsDeOperaciones(), S.opFiltro.orden), [['fecha','Fecha'],['ml_order_id','Orden'],['sku','SKU'],['item_id','Publicación'],['titulo','Título'],['listing_type','Tipo pub.'],['tipo_envio','Envío'],['units','Unidades'],['precio_lista_unit','Precio lista'],['precio_cobrado_unit','Precio cobrado'],['descuento_pct','Desc %'],['bruto','Bruto'],['comision','Comisión'],['comision_pct','Comisión %'],['envio','Envío $'],['neto_ml','Neto ML'],['costo_unit','Costo unit.'],['costo_total','Costo total'],['costo_fuente','Fuente costo'],['costo_fecha_ref','Fecha costo'],['costo_confiable','Costo confiable'],['zona_logistica','Zona Flex'],['brown_estimado','Zona estimada'],['brown','Logística Flex'],['embalaje','Embalaje'],['prorrateo_facturas','Facturas ML manuales'],['cargo_ml_periodo','Facturación ML imputada'],['iibb_periodo','Percepciones IIBB'],['iibb_descontado','IIBB descontado'],['margen','Margen'],['margen_pct_neto','% neto'],['margen_pct_precio','% precio'],['semaforo','Semáforo']]); break;
      case 'csvAgrup': { const a = S.agrup; const g = gruposAgrupado(opsFiltradas(), a.por);
        descargarCsv('margenes_por_' + a.por, ordenar(g, a.orden), [['clave', a.por], ['label','Detalle'], ['unidades','Unidades'], ['precioProm','Precio prom.'], ['bruto','Bruto'], ['comisionPct','Comisión %'], ['envioProm','Envío/orden'], ['brownTodo','Logística Flex'], ['flex','Envíos Flex'], ['neto','Neto ML'], ['costo','Costo'], ['margen','Margen'], ['margenPctNeto','% neto'], ['margenPctPrecio','% precio'], ['margenPorUnidad','Margen/u'], ['neg','Negativas'], ['bajo','Bajo umbral']]); break; }
      case 'csvStock': descargarCsv('stock_valorizado', ordenar(S.stock || [], S.stockVista.orden), [['sku','SKU'],['proveedor','Proveedor'],['propio','Propio'],['en_full','Full'],['total','Total'],['costo_unit','Costo real'],['costo_fuente','Fuente'],['valor','Valor'],['costo_maestro','Costo maestro'],['valor_maestro','Valor maestro'],['unidades_60d','Vendidas 60d'],['dias_cobertura','Cobertura días'],['ultima_venta','Última venta']]); break;
      case 'calcDesdeOp': $('modalRaiz').innerHTML = ''; precargarCalcSku(b.dataset.sku); S.tab = 'calculadora'; guardarPrefs(); render(); window.scrollTo(0, 0); break;
      case 'cgPreview': leerCarga(); if (!S.carga.texto.trim()) { toast('Pegá al menos una línea SKU + valor', 'err'); break; } S.carga.preview = prepararPreviewCarga(); render(); break;
      case 'cgGuardar': leerCarga(); S.carga.preview = prepararPreviewCarga(); { const ok = S.carga.preview.filter((f) => f.ok).length; confirmar(`Se van a guardar <b>${ok}</b> costos con vigencia desde <b>${fechaCorta(S.carga.vigencia || hoyAR())}</b>. Cambia el margen de las ventas desde esa fecha. No toca ML ni el Excel maestro.`, guardarCargaCostos, 'Guardar costos'); } break;
      case 'borrarManual': confirmar('Se borra este costo manual. El SKU vuelve a tomar el costo de la última compra.', async () => { await api('costo_manual_borrar', { id: Number(b.dataset.id) }); toast('Costo manual borrado', 'ok'); S.ops = null; S.stock = null; await cargarCostos(true); }, 'Borrar'); break;
      case 'guardarRegla': { const r = await api('regla_guardar', { proveedor_id: $('rgProv').value, metodo: $('rgMetodo').value, iva: n($('rgIva').value) / 100, desc_propio: n($('rgDesc').value) / 100 }); if (r.ok) { toast('Regla guardada', 'ok'); S.ops = null; S.stock = null; await cargarCostos(true); } break; }
      case 'guardarAjustes': {
        const v = (id) => $(id).value;
        const r = await api('config_guardar', { umbral_margen_pct: v('ajUmbral'), embalaje_por_orden: v('ajEmb') === '' ? null : v('ajEmb'), prorrateo_criterio: v('ajProrr') || null, costo_max_antiguedad_dias: v('ajAntig'), desde: v('ajDesde') });
        S.config = r.config; S.ops = null; toast('Parámetros guardados: el margen se recalcula', 'ok'); render(); break; }
      case 'guardarFactura': {
        const per = $('fcPeriodo').value; const imp = parsearNumero($('fcImporte').value);
        if (!per || !$('fcConcepto').value.trim() || !imp) { toast('Completá mes, concepto e importe', 'err'); break; }
        await api('factura_guardar', { periodo: per + '-01', concepto: $('fcConcepto').value, importe: imp, alcance: $('fcAlcance').value, sku: $('fcSku').value });
        toast('Concepto agregado', 'ok'); $('fcConcepto').value = ''; $('fcImporte').value = ''; S.ops = null; await pintarFacturas(true); break; }
      case 'borrarFactura': confirmar('Se borra este concepto de factura.', async () => { await api('factura_borrar', { id: Number(b.dataset.id) }); toast('Concepto borrado', 'ok'); S.ops = null; await pintarFacturas(true); }, 'Borrar'); break;
    }
  } catch (e) { toast('⚠️ ' + e.message, 'err'); }
});
function leerCarga() {
  const c = S.carga;
  if ($('cgModo')) { c.modo = $('cgModo').value; c.vigencia = $('cgVig').value; c.proveedor = $('cgProv').value; c.texto = $('cgTexto').value; }
}
document.addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'opQ') { S.opFiltro.q = ev.target.value; S.opFiltro.limite = CONFIG.FILAS_POR_PAGINA; rerenderManteniendoFoco(id); }
  else if (id === 'agQ') { S.agrup.q = ev.target.value; rerenderManteniendoFoco(id); }
  else if (id === 'cvQ') { S.costosVista.q = ev.target.value; rerenderManteniendoFoco(id); }
  else if (id === 'mapQ') { S.logVista.qMapeo = ev.target.value; rerenderManteniendoFoco(id); }
  else if (id && id.startsWith('cc') && id !== 'ccSku') { leerCalc(); calcularPrecioPiso(); }
});
document.addEventListener('change', (ev) => {
  const id = ev.target.id;
  if (id === 'opEnvio') { S.opFiltro.envio = ev.target.value; render(); }
  else if (id === 'opSem') { S.opFiltro.sem = ev.target.value; render(); }
  else if (id === 'chkConfiables') { S.soloConfiables = ev.target.checked; guardarPrefs(); render(); }
  else if (id === 'chkAlertEst') { S.alertas.incluirEstimados = ev.target.checked; render(); }
  else if (id === 'cvDif') { S.costosVista.soloDif = ev.target.checked; render(); }
  else if (id === 'chkLento') { S.stockVista.soloLento = ev.target.checked; render(); }
  else if (id === 'ccSku') { leerCalc(); if (CALC.sku) { precargarCalcSku(CALC.sku); render(); } }
  else if (id === 'ccModo') { leerCalc(); calcularPrecioPiso(); }
  // al elegir "desde" de una liquidación se precargan las tarifas vigentes en esa fecha (se conservan los envíos tipeados)
  else if (id === 'lqDesde' || id === 'lqHasta') {
    S.logVista.liqDesde = $('lqDesde').value; S.logVista.liqHasta = $('lqHasta').value;
    if (id === 'lqDesde') { const envs = []; let i = 0; while ($('lqEnv_' + i)) { envs.push($('lqEnv_' + i).value); i++; } render(); envs.forEach((v, j) => { if ($('lqEnv_' + j)) $('lqEnv_' + j).value = v; }); }
  }
  else if (['cgModo', 'cgProv', 'cgVig'].includes(id)) { leerCarga(); if (S.carga.preview) { S.carga.preview = prepararPreviewCarga(); render(); } }
});
let debounceT;
function rerenderManteniendoFoco(id) {
  clearTimeout(debounceT);
  debounceT = setTimeout(() => { const el = $(id); const pos = el ? el.selectionStart : null; render(); const n2 = $(id); if (n2) { n2.focus(); if (pos !== null) n2.setSelectionRange(pos, pos); } }, 180);
}
$('btnAplicarRango').addEventListener('click', () => {
  const d = $('fDesde').value, h = $('fHasta').value;
  if (!d || !h || d > h) { toast('Rango inválido', 'err'); return; }
  S.desde = d; S.hasta = h; guardarPrefs(); renderBarraPeriodo(); cargarOps();
});
$('btnRecargar').addEventListener('click', () => { S.ops = null; cargarOps(true); });
$('btnFunc').addEventListener('click', abrirFuncionamiento);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modalRaiz').innerHTML = ''; });
window.addEventListener('resize', () => { if (S.tab === 'resumen') montarGraficoMensual(); });

function asegurarDatos() {
  if (['resumen', 'operaciones', 'agrupado', 'alertas', 'calculadora'].includes(S.tab)) cargarOps();
  if (S.tab === 'costos') cargarCostos();
  if (S.tab === 'stock') cargarStock();
  if (S.tab === 'ajustes') {
    if (S.ajSub === 'logistica') cargarLogistica();
    else if (S.ajSub === 'facturacion') cargarFacturacion();
    else if (S.ajSub === 'manuales') pintarFacturas();
  }
}

   ============================================================ */
$('gateTitulo').textContent = `${CONFIG.BRAND.app} · ${CONFIG.BRAND.nombre}`;
document.title = `${CONFIG.BRAND.app} · ${CONFIG.BRAND.nombre}`;
async function hacerLogin() {
  const email = $('gateEmail').value.trim(), pass = $('gatePass').value, err = $('gateError'), btn = $('gateBtn');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Completá email y contraseña.'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando…';
  try { const { error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw error; }
  catch (_) { err.textContent = 'No se pudo iniciar sesión. Revisá tus datos.'; btn.disabled = false; btn.textContent = 'Ingresar'; }
}
$('gateBtn').addEventListener('click', hacerLogin);
$('gatePass').addEventListener('keydown', (e) => { if (e.key === 'Enter') hacerLogin(); });
$('btnLogout').addEventListener('click', () => sb.auth.signOut());

let arrancado = false;
sb.auth.onAuthStateChange(async (_ev, session) => {
  if (session) {
    S.auth = 'Bearer ' + session.access_token;
    $('gate').classList.add('oculto'); $('app').classList.remove('oculto');
    if (arrancado) return; arrancado = true;
    leerPrefs(); render();
    try { await cargarConfig(); } catch (e) {
      $('vista').innerHTML = estadoError('No se pudo validar tu usuario: ' + e.message, 'recargar'); return;
    }
    render(); asegurarDatos();
  } else {
    S.auth = null; arrancado = false; S.ops = null; S.costos = null; S.stock = null; S.logistica = null; S.facturacion = null; S.facManuales = null;
    $('app').classList.add('oculto'); $('gate').classList.remove('oculto');
    $('gateBtn').disabled = false; $('gateBtn').textContent = 'Ingresar';
  }
});
sb.auth.getSession();
